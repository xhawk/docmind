[project]
name = "docmind"
version = "0.1.0"
description = "Talk with your documents (PDFs, images, screenshots)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
docmind = "docmind:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
